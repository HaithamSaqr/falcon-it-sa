version: "3.8"

services:
  falcon-web:
    build: .
    container_name: falcon-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - falcon-data:/app/data
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  falcon-data:
