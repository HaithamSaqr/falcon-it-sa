# ───────────────────────────────────────────────────────────────────────────
# Falcon IT — Portainer stack (app + PostgreSQL on one private network)
#
# Deploy:
#   1) Make sure the app image exists in Portainer → Images, and set the
#      `image:` value under the `app` service to its EXACT name.
#   2) Portainer → Stacks → Add stack → paste this file → Deploy.
#   3) Open  http://<server-ip>:3001/setup  → the wizard is pre-filled
#      (Host = db). Enter the SAME password below + create the admin account.
# ───────────────────────────────────────────────────────────────────────────

# ⬇️ كلمة مرور قاعدة البيانات — تُكتب هنا مرة واحدة فقط وتُستخدم في الخدمتين.
#    لو احتوت كلمة المرور على علامة $ فضاعفها هكذا: $$
x-db-password: &db_password "P@ss@123"

services:
  db:
    image: postgres:16-alpine
    container_name: falcon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: falcon
      POSTGRES_USER: falcon
      POSTGRES_PASSWORD: *db_password
      TZ: Asia/Riyadh
    # Performance tuning — adjust to your server's RAM (these suit ~1–2 GB).
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "synchronous_commit=off"   # faster writes; tiny durability trade-off on crash
    volumes:
      - falcon-db-data:/var/lib/postgresql/data
    networks:
      - falcon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falcon -d falcon -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    # ⬇️ غيّر هذا الاسم ليطابق تماماً اسم الإيمدج في Portainer → Images
    image: falcon-itsa-falcon-web:latest
    container_name: falcon-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      TZ: Asia/Riyadh
      # Pre-fill the first-run setup wizard. Host MUST be the db service name.
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: falcon
      PGUSER: falcon
      PGPASSWORD: *db_password
    volumes:
      # Persists db-config.json + uploaded images across restarts/updates.
      - falcon-app-data:/app/data
    networks:
      - falcon-net
    healthcheck:
      # Hits a public endpoint that returns 200 even before the wizard runs.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/settings/public',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  falcon-db-data:
  falcon-app-data:

networks:
  falcon-net:
    driver: bridge
